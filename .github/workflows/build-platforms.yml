name: Build example on all platforms

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
          - target: web
            os: ubuntu-latest
          - target: linux
            os: ubuntu-latest
          - target: windows
            os: windows-latest
          - target: ios
            os: macos-latest
          - target: macos
            os: macos-latest
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: example
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: flutter pub get
      - name: Download Drift Web assets
        if: matrix.target == 'web'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release download drift-2.31.0 --repo simolus3/drift \
            --pattern 'drift_worker*' --dir web
          gh release download sqlite3-2.9.4 --repo simolus3/sqlite3.dart \
            --pattern sqlite3.wasm --dir web
          if [ ! -f web/drift_worker.dart.js ] && [ -f web/drift_worker.js ]; then
            cp web/drift_worker.js web/drift_worker.dart.js
          fi
          test -f web/sqlite3.wasm
          test -f web/drift_worker.dart.js
      - name: Build Android
        if: matrix.target == 'android'
        run: flutter build apk --release
      - name: Build Web
        if: matrix.target == 'web'
        run: flutter build web --release
      - name: Build Linux
        if: matrix.target == 'linux'
        run: flutter build linux --release
      - name: Build Windows
        if: matrix.target == 'windows'
        run: flutter build windows --release
      - name: Build iOS
        if: matrix.target == 'ios'
        run: flutter build ios --release --no-codesign
      - name: Build macOS
        if: matrix.target == 'macos'
        run: flutter build macos --release
